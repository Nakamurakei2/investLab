services:
  postgres:
    image: postgres:16-alpine
    container_name: investlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investlab}
      POSTGRES_USER: ${POSTGRES_USER:-investlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - investlab-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investlab} -d ${POSTGRES_DB:-investlab}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  investlab-postgres-data:
